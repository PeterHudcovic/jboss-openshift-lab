apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: peter-hudcovic-dev
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgresql

  template:
    metadata:
      labels:
        app: postgresql

    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-16-c9s

          ports:
            - name: postgresql
              containerPort: 5432

          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: peter-hudcovic-dev
spec:
  type: ClusterIP

  selector:
    app: postgresql

  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql